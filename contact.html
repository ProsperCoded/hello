    <h1>Contact Me</h1>

    <div class="contact-info">
        <p><strong>Name:</strong> Enwerem Prosper</p>
        <p><strong>Email:</strong> prosper@example.com</p>
        <p><strong>Department:</strong> Department of Computer Science</p>
    </div>

    <h2>Send a Message</h2>
    <form action="#" method="post">
        <div>
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 12px;">
        </div>
        <div>
            <label for="email">Your Email:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 12px;">
        </div>
        <div>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 12px;"></textarea>
        </div>
        <div>
            <button type="submit" style="background-color: #2b6cb0; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Submit</button>
        </div>
    </form>
</body>
